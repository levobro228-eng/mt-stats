<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика винрейта — Мир Танков</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1> Статистика винрейта «Мир Танков»</h1>
            <p class="subtitle">Актуальные данные по кластеру RU. Обновлено: <span id="update-date">...</span></p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label> Период:</label>
                <select id="period-select">
                    <option value="3m">3 месяца (текущая мета)</option>
                    <option value="6m" selected>6 месяцев</option>
                    <option value="12m">1 год</option>
                    <option value="all">За всё время</option>
                </select>
            </div>

            <div class="control-group">
                <label>🔍 Поиск:</label>
                <input type="text" id="search-input" placeholder="Название танка...">
            </div>

            <div class="control-group">
                <label>📊 Тип:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" class="filter-type" value="regular" checked> Обычные</label>
                    <label><input type="checkbox" class="filter-type" value="premium" checked> Премиум</label>
                    <label><input type="checkbox" class="filter-type" value="collector" checked> Коллекционные</label>
                </div>
            </div>

            <div class="control-group">
                <label>🎯 Класс:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" class="filter-class" value="ТТ" checked> ТТ</label>
                    <label><input type="checkbox" class="filter-class" value="СТ" checked> СТ</label>
                    <label><input type="checkbox" class="filter-class" value="ЛТ" checked> ЛТ</label>
                    <label><input type="checkbox" class="filter-class" value="ПТ-САУ" checked> ПТ-САУ</label>
                    <label><input type="checkbox" class="filter-class" value="САУ" checked> САУ</label>
                </div>
            </div>

            <div class="control-group">
                <label>⭐ Уровень:</label>
                <div class="checkbox-group" id="level-filters">
                    <!-- Заполняется через JS -->
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Танков</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-avg-winrate">0%</div>
                <div class="stat-label">Средний винрейт</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-battles">0</div>
                <div class="stat-label">Всего боёв</div>
            </div>
        </div>

        <div class="table-container">
            <table id="tanks-table">
                <thead>
                    <tr>
                        <th>Танк</th>
                        <th>Тип</th>
                        <th>Ур.</th>
                        <th>Класс</th>
                        <th>Боёв</th>
                        <th>Винрейт</th>
                    </tr>
                </thead>
                <tbody id="tanks-body">
                    <tr><td colspan="6" class="loading">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>

        <footer>
            <p>Данные: <a href="https://wotstat.info/" target="_blank">wotstat.info</a> • Сделано с ❤️ для игроков «Мира Танков»</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
